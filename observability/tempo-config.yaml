# Minimal Tempo configuration: receive OTLP traces from the collector and
# store them locally. Query via HTTP on :3200 (Grafana datasource).
server:
  http_listen_port: 3200

multitenancy_enabled: false

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 48h
