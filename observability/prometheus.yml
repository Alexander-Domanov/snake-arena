# Prometheus configuration for the Interview Canvas observability stack.
# Scrapes the OTel Collector's Prometheus exposition endpoint (metrics from
# all connected app instances: local dev, staging, production).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/alerting.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          job: interview-canvas
