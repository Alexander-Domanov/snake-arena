[project]
name = "interview-canvas"
version = "0.1.0"
description = "Interview Canvas — collaborative whiteboard for system design interviews (FastAPI + SQLite)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
