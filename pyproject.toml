[project]
name = "interview-canvas"
version = "0.1.0"
description = "Interview Canvas — collaborative whiteboard for system design interviews (FastAPI + SQLite)"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: tests that run against a real Postgres database (start it with: docker compose up -d)",
    "e2e: Playwright end-to-end tests against the docker-compose stack (start it with: docker compose up -d; run with: uv run pytest e2e -v)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
]
